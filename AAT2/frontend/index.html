<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AAT2 · Query Desk</title><style>
:root{--ink:#172b2b;--accent:#087f70;--soft:#e7f7f3;--muted:#607775}*{box-sizing:border-box}body{margin:0;background:#f3faf8;color:var(--ink);font:16px/1.55 system-ui,sans-serif}main{max-width:850px;margin:auto;padding:40px 22px}header>span{font-size:12px;letter-spacing:.15em;font-weight:800;color:var(--accent)}h1{font-size:clamp(40px,7vw,62px);margin:12px 0;line-height:1}h1 b{color:var(--accent)}p{color:var(--muted)}.search,.answer,.result{background:white;padding:22px;border:1px solid #dcece8;border-radius:18px;margin:18px 0}label{font-weight:700;display:block;margin-bottom:8px}.searchrow{display:flex;gap:10px}input{min-width:0;flex:1;border:1px solid #cbded9;border-radius:10px;padding:13px;font:inherit}button{border:0;border-radius:10px;padding:12px 18px;background:var(--accent);color:white;font-weight:800;cursor:pointer}.answer{background:var(--soft);border-color:#bce9de}h2{font-size:20px}.score{color:var(--accent);font-size:12px;font-weight:800}footer{margin-top:36px;color:var(--muted);font-size:13px}@media(max-width:540px){.searchrow{flex-direction:column}}
</style></head><body><main><header><span>RETRIEVAL SYSTEM / 02</span><h1>Query <b>Desk</b></h1><p>Ask a question and retrieve the closest passages from a tiny NLP knowledge base.</p></header><section class="search"><label for="query">Your question</label><div class="searchrow"><input id="query" value="What does TF-IDF do?"><button id="run">Search</button></div><p id="status" role="status"></p></section><section class="answer"><h2>Best answer</h2><p id="answer">Your best matching passage will appear here.</p></section><section><h2>Ranked passages</h2><div id="results"></div></section><footer>TF-IDF vectors · Cosine similarity · Local sample documents</footer></main><script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));$("run").onclick=async()=>{$("status").textContent="Searching…";try{const r=await fetch("/api/search",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:$("query").value})});const d=await r.json();if(!r.ok)throw Error(d.error);$("answer").textContent=d.answer;$("results").innerHTML=d.results.length?d.results.map(x=>'<article class="result"><div class="score">SIMILARITY '+x.score+'</div><h3>'+esc(x.title)+'</h3><p>'+esc(x.text)+'</p></article>').join(""):"No passages matched.";$("status").textContent=d.results.length+" result(s)"}catch(e){$("status").textContent=e.message}};
</script></body></html>
