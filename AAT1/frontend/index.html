<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AAT1 · Token Lab</title><style>
:root{--ink:#20283a;--accent:#6b4eff;--paper:#f5f3ff}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,sans-serif}main{max-width:900px;margin:auto;padding:42px 22px}.eyebrow{font-size:12px;letter-spacing:.16em;font-weight:800;color:var(--accent)}h1{font-size:clamp(40px,8vw,68px);line-height:1;margin:12px 0}h1 em{color:var(--accent);font-style:normal}p{color:#69748b}.panel{background:white;border:1px solid #e3defb;border-radius:20px;padding:22px}label{display:block;font-weight:700;margin-bottom:8px}textarea{width:100%;padding:14px;border:1px solid #d9d5eb;border-radius:12px;font:inherit}button{margin-top:12px;border:0;border-radius:12px;padding:12px 18px;background:var(--accent);color:white;font-weight:750;cursor:pointer}h2{margin:28px 0 12px}.wrap{display:flex;flex-wrap:wrap;gap:8px}.token,.entity{background:white;border:1px solid #e5e0fa;border-radius:10px;padding:9px 12px}.token small,.entity small{display:block;color:#69748b;font-size:11px}.entity{border-color:#b8eadb}footer{margin-top:42px;font-size:13px;color:#69748b}
</style></head><body><main><span class="eyebrow">ANLP / EXPERIMENT 01</span><h1>Token <em>Lab</em></h1><p>Explore parts of speech, lemmas, and named entities.</p><section class="panel"><label for="text">Text to analyze</label><textarea id="text" rows="5">Dr. Asha Rao joined Google in Bengaluru on Monday.</textarea><button id="run">Analyze text →</button><p id="status" role="status"></p></section><h2>Tokens</h2><div id="tokens" class="wrap">Your token breakdown will appear here.</div><h2>Named entities</h2><div id="entities" class="wrap">Entities will appear here.</div><footer>Powered by spaCy · Educational demo</footer></main><script>
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));$("run").onclick=async()=>{const status=$("status");status.textContent="Analyzing…";try{const r=await fetch("/api/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:$("text").value})});const d=await r.json();if(!r.ok)throw Error(d.error);$("tokens").innerHTML=d.tokens.map(t=>'<div class="token"><b>'+esc(t.text)+'</b><small>'+esc(t.pos)+' · '+esc(t.tag)+'</small><small>lemma: '+esc(t.lemma)+'</small></div>').join("");$("entities").innerHTML=d.entities.length?d.entities.map(e=>'<div class="entity"><b>'+esc(e.text)+'</b><small>'+esc(e.label)+' — '+esc(e.description)+'</small></div>').join(""):"No named entities detected.";status.textContent=d.tokens.length+" tokens analyzed."}catch(e){status.textContent=e.message}};
</script></body></html>
