<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AAT5 · Sense Finder</title><style>
:root{--ink:#29243c;--accent:#7654b5;--wash:#f2edfb;--muted:#716c82}*{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font:16px/1.55 system-ui,sans-serif}main{max-width:780px;margin:auto;padding:42px 22px}header>span{font-size:12px;letter-spacing:.15em;color:var(--accent);font-weight:800}h1{font-size:clamp(40px,8vw,64px);letter-spacing:-.04em;line-height:1.05;margin:12px 0}h1 span{display:block;color:var(--accent)}p{color:var(--muted)}.form,.result{background:white;border:1px solid #e2d8f3;border-radius:18px;padding:22px;margin-top:20px}label{display:block;font-weight:750;margin:14px 0 7px}textarea,input{width:100%;border:1px solid #d9cde9;border-radius:10px;padding:12px;font:inherit}button{margin-top:14px;border:0;border-radius:10px;background:var(--accent);color:white;padding:12px 17px;font-weight:800;cursor:pointer}.result{background:#fbf9ff}.result h2{margin-top:0}.sense{background:var(--wash);border-radius:10px;padding:12px;margin:12px 0}.sense code{color:var(--accent);font-weight:800}footer{margin-top:38px;font-size:13px;color:var(--muted)}
</style></head><body><main><header><span>LEXICAL SEMANTICS / 05</span><h1>Sense<span>Finder</span></h1><p>Words can mean different things. Use sentence context to estimate the intended WordNet sense.</p></header><section class="form"><label for="sentence">Sentence</label><textarea id="sentence" rows="3">She deposited her salary at the bank near the river.</textarea><label for="word">Ambiguous word</label><input id="word" value="bank"><button id="run">Find word sense</button><p id="status" role="status"></p></section><section id="result" class="result"><h2>Predicted meaning</h2><p>The selected meaning and WordNet definition will appear here.</p></section><footer>NLTK · WordNet · Simplified Lesk overlap heuristic</footer></main><script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));$("run").onclick=async()=>{$("status").textContent="Checking WordNet…";try{const r=await fetch("/api/disambiguate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sentence:$("sentence").value,word:$("word").value})});const d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");$("result").innerHTML='<h2>Predicted meaning</h2><div class="sense"><code>'+(d.synset?esc(d.synset):"No synset")+'</code><p>'+esc(d.definition)+'</p></div>'+(d.lemmas&&d.lemmas.length?'<p><b>Related lemmas:</b> '+d.lemmas.map(esc).join(", ")+'</p>':"")+(d.examples&&d.examples.length?'<p><b>WordNet examples:</b> '+d.examples.map(esc).join(" · ")+'</p>':"");$("status").textContent=d.synset?"Sense prediction complete.":"No confident sense returned."}catch(e){$("status").textContent=e.message}};
</script></body></html>
