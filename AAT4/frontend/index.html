<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AAT4 · Topic Garden</title><style>
:root{--ink:#273728;--accent:#3c8050;--light:#edf6e9;--muted:#718071}*{box-sizing:border-box}body{margin:0;background:#f7faf3;color:var(--ink);font:16px/1.5 system-ui,sans-serif}main{max-width:900px;margin:auto;padding:42px 22px}header>span{font-size:12px;letter-spacing:.14em;font-weight:800;color:var(--accent)}h1{font-size:clamp(40px,8vw,64px);line-height:1.05;margin:12px 0}h1 i{font-family:Georgia,serif;font-weight:500;color:var(--accent)}p{color:var(--muted)}.controls{background:white;border:1px solid #dce8d7;border-radius:18px;padding:22px}label{font-weight:750;display:block;margin-bottom:8px}select{padding:11px;border:1px solid #cddbc7;border-radius:9px;font:inherit}button{margin-left:8px;padding:12px 16px;border:0;border-radius:9px;background:var(--accent);color:white;font-weight:800;cursor:pointer}h2{margin-top:30px}.topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.topic{background:var(--light);border:1px solid #d5e8cd;border-radius:16px;padding:18px}.topic h3{margin:0 0 14px}.word{display:inline-block;background:white;border-radius:20px;padding:6px 10px;margin:3px;font-size:13px}.word b{color:var(--accent)}footer{margin-top:38px;color:var(--muted);font-size:13px}
</style></head><body><main><header><span>UNSUPERVISED LEARNING / 04</span><h1>Topic <i>Garden</i></h1><p>Let recurring words reveal the themes inside a document collection.</p></header><section class="controls"><label for="n">Number of topics</label><select id="n"><option value="2">2 topics</option><option value="3" selected>3 topics</option><option value="4">4 topics</option><option value="5">5 topics</option></select><button id="run">Grow topics</button><p id="status" role="status"></p></section><h2>Learned themes</h2><div id="topics" class="topics"><p>Run the model to see topic word groups.</p></div><footer>LDA · Count vectors · Ten-document demonstration corpus</footer></main><script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));$("run").onclick=async()=>{$("status").textContent="Fitting LDA model…";try{const r=await fetch("/api/topics",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({n_topics:$("n").value})});const d=await r.json();if(!r.ok)throw Error(d.error||"Could not model topics");$("topics").innerHTML=d.topics.map(t=>'<article class="topic"><h3>Theme '+t.topic+'</h3>'+t.words.map(w=>'<span class="word">'+esc(w.word)+' <b>'+w.weight+'</b></span>').join("")+'</article>').join("");$("status").textContent="Modelled "+d.documents+" documents."}catch(e){$("status").textContent=e.message}};
</script></body></html>
