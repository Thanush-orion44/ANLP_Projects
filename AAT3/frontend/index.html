<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AAT3 · Story Index</title><style>
:root{--ink:#25231f;--accent:#c45b38;--sand:#fff4e9;--muted:#77716a}*{box-sizing:border-box}body{margin:0;background:#fcf8f2;color:var(--ink);font:16px/1.55 system-ui,sans-serif}main{max-width:900px;margin:auto;padding:42px 22px}header>span{font-size:12px;letter-spacing:.14em;color:var(--accent);font-weight:800}h1{font-size:clamp(42px,8vw,68px);letter-spacing:-.05em;margin:10px 0}h1 span{color:var(--accent)}p{color:var(--muted)}.ask{padding:22px;background:var(--sand);border:1px solid #f0d7c4;border-radius:18px}label{display:block;font-weight:750;margin-bottom:8px}textarea{width:100%;border:1px solid #e5c9b5;border-radius:10px;padding:12px;font:inherit}button{display:block;margin-top:12px;border:0;background:var(--accent);color:white;padding:12px 16px;border-radius:10px;font-weight:800;cursor:pointer}.answer,.movie{background:white;border:1px solid #e9e2d8;padding:18px;border-radius:14px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.movie h3{margin:0 0 4px}.movie small{color:var(--accent);font-weight:800}.movie p{margin-bottom:0}h2{margin-top:30px;font-size:21px}footer{margin-top:38px;color:var(--muted);font-size:13px}
</style></head><body><main><header><span>KNOWLEDGE RETRIEVAL / 03</span><h1>Story<span>Index</span></h1><p>Ask about a genre, director, plot, or title. Answers are built from local records.</p></header><section class="ask"><label for="question">Ask the movie collection</label><textarea id="question" rows="2">Which movie is about a research station in space?</textarea><button id="run">Retrieve evidence ↗</button><p id="status" role="status"></p></section><h2>Grounded response</h2><div id="answer" class="answer">Your response will appear here.</div><h2>Retrieved sources</h2><div id="sources" class="cards"></div><footer>Local sample database · TF-IDF retrieval · No external LLM calls</footer></main><script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));$("run").onclick=async()=>{$("status").textContent="Retrieving records…";try{const r=await fetch("/api/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:$("question").value})});const d=await r.json();if(!r.ok)throw Error(d.error);$("answer").textContent=d.answer;$("sources").innerHTML=d.sources.length?d.sources.map(m=>'<article class="movie"><small>'+m.year+' · '+esc(m.genre)+' · score '+m.score+'</small><h3>'+esc(m.title)+'</h3><p>'+esc(m.plot)+'</p><p>Director: '+esc(m.director)+'</p></article>').join(""):"No source records retrieved.";$("status").textContent=d.sources.length+" evidence record(s)"}catch(e){$("status").textContent=e.message}};
</script></body></html>
